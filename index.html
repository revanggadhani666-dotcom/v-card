<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aktivasi</title><style>body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:16px}.card{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:400px}input{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:14px;margin:8px 0;box-sizing:border-box}.btn{width:100%;padding:16px;background:#2563eb;color:#fff;border:none;border-radius:99px;font-weight:700}</style></head><body><div class="card"><h2>Aktivasi Kartu</h2><p>Kode: <b id="kd">TEST</b></p><input id="bisnis" placeholder="Nama Bisnis + Kota"><input id="link" placeholder="Link Google Review"><input id="pin" type="password" maxlength="4" placeholder="PIN 4 digit"><button class="btn" onclick="go()">Aktifkan</button></div><script>let c=new URLSearchParams(location.search).get('c')||'TEST';document.getElementById('kd').innerText=c;function go(){let b=document.getElementById('bisnis').value,l=document.getElementById('link').value,p=document.getElementById('pin').value;if(!b||!l||p.length!=4){alert('Lengkapi bos!');return}localStorage.setItem('v_'+c,JSON.stringify({b:b,l:l,p:p}));location.href='sukses.html?c='+c}</script></body></html>
